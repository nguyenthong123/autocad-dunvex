services:
  chili3d:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${APP_PUBLIC_PORT:-80}:80"
      - "${APP_FALLBACK_PORT:-8080}:80"
    depends_on:
      - storage-api
    deploy:
      resources:
        limits:
          memory: 128M

  storage-api:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./server:/app/server:ro
      - chili3d-data:/data/storage
    environment:
      - PORT=3000
      - DATA_DIR=/data/storage
      - LLM_CREDENTIALS_ENCRYPTION_KEY=${LLM_CREDENTIALS_ENCRYPTION_KEY:-}
    command: ["node", "server/storageServer.mjs"]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 192M

volumes:
  chili3d-data:
