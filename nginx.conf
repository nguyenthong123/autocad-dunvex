server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/mime.types;
    types {
        application/wasm wasm;
    }

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/wasm
        image/svg+xml;

    # HTML và version metadata: LUÔN kiểm tra lại (no-cache, must-revalidate)
    location = / {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        try_files /index.html =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    location ~* ^/(version\.json|deploy-version\.json|\.build-meta\.json)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # Cache dài hạn cho các file tĩnh có content hash (.wasm, .ttf và .[hash].js/css)
    location ~* "\.([0-9a-fA-F]{8,32})\.(js|css|wasm|ttf)$" {
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Cache dài hạn cho file .wasm có tên mã hash độc lập
    location ~* "^/[0-9a-fA-F]{16,64}\.wasm$" {
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Các file tài nguyên tĩnh khác: nếu thiếu/cũ trả 404, TUYỆT ĐỐI KHÔNG fallback về index.html
    location ~* \.(js|mjs|css|wasm|json|cur|woff2?|ttf|png|jpe?g|gif|svg|ico|map)$ {
        try_files $uri =404;
    }

    # LLM Proxy (SSE unbuffered streaming, 300s timeout, 25MB body)
    location /api/llm-proxy/ {
        client_max_body_size 25M;
        proxy_pass http://storage-api:3000/api/llm-proxy/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /api/ {
        client_max_body_size 50M;
        proxy_pass http://storage-api:3000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
